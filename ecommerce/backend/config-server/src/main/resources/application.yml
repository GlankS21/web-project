server:
  port: ${CONFIG_SERVER_PORT:8888}
  shutdown: graceful

spring:
  application:
    name: config-server
  profiles:
    default: dev
    # The config server always serves files from the "native" (file system / classpath) backend.
    group:
      dev: native
      docker: native
  cloud:
    config:
      server:
        native:
          search-locations: ${CONFIG_SEARCH_LOCATIONS:classpath:/config-repo}
  security:
    user:
      name: ${CONFIG_SERVER_USERNAME}
      password: ${CONFIG_SERVER_PASSWORD}
  lifecycle:
    timeout-per-shutdown-phase: 20s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: Centralized configuration server

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{correlationId:-}]"
