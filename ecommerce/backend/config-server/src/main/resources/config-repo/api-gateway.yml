server:
  port: ${API_GATEWAY_PORT:8080}

spring:
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 5000
            response-timeout: 15s
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
          routes:
            # ------------------------------------------------------------- business APIs
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/auth/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: auth-service
                    fallbackUri: forward:/fallback/auth-service
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/users/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: user-service
                    fallbackUri: forward:/fallback/user-service
            - id: product-service
              uri: lb://product-service
              predicates:
                - Path=/api/products/**,/api/categories/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: product-service
                    fallbackUri: forward:/fallback/product-service
            - id: inventory-service
              uri: lb://inventory-service
              predicates:
                - Path=/api/inventory/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: inventory-service
                    fallbackUri: forward:/fallback/inventory-service
            - id: cart-service
              uri: lb://cart-service
              predicates:
                - Path=/api/cart/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: cart-service
                    fallbackUri: forward:/fallback/cart-service
            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/api/orders/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: order-service
                    fallbackUri: forward:/fallback/order-service
            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=/api/payments/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: payment-service
                    fallbackUri: forward:/fallback/payment-service
            - id: notification-service
              uri: lb://notification-service
              predicates:
                - Path=/api/notifications/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: notification-service
                    fallbackUri: forward:/fallback/notification-service
            # ------------------------------------------------------------- OpenAPI documents
            - id: auth-service-docs
              uri: lb://auth-service
              predicates:
                - Path=/docs/auth-service/v3/api-docs
              filters:
                - SetPath=/v3/api-docs
            - id: user-service-docs
              uri: lb://user-service
              predicates:
                - Path=/docs/user-service/v3/api-docs
              filters:
                - SetPath=/v3/api-docs
            - id: product-service-docs
              uri: lb://product-service
              predicates:
                - Path=/docs/product-service/v3/api-docs
              filters:
                - SetPath=/v3/api-docs
            - id: inventory-service-docs
              uri: lb://inventory-service
              predicates:
                - Path=/docs/inventory-service/v3/api-docs
              filters:
                - SetPath=/v3/api-docs
            - id: cart-service-docs
              uri: lb://cart-service
              predicates:
                - Path=/docs/cart-service/v3/api-docs
              filters:
                - SetPath=/v3/api-docs
            - id: order-service-docs
              uri: lb://order-service
              predicates:
                - Path=/docs/order-service/v3/api-docs
              filters:
                - SetPath=/v3/api-docs
            - id: payment-service-docs
              uri: lb://payment-service
              predicates:
                - Path=/docs/payment-service/v3/api-docs
              filters:
                - SetPath=/v3/api-docs
            - id: notification-service-docs
              uri: lb://notification-service
              predicates:
                - Path=/docs/notification-service/v3/api-docs
              filters:
                - SetPath=/v3/api-docs

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
  timelimiter:
    configs:
      default:
        timeout-duration: 15s

app:
  gateway:
    security:
      public-paths:
        - /api/auth/register
        - /api/auth/login
        - /api/auth/refresh
        - /api/auth/logout
        - /actuator/health
        - /actuator/health/**
        - /actuator/info
        - /swagger-ui.html
        - /swagger-ui/**
        - /v3/api-docs/**
        - /webjars/**
        - /docs/**
      public-get-paths:
        - /api/products/**
        - /api/categories/**
        - /api/inventory/availability
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
      max-age: 1h
    # The frontend's server side relays browser requests; with this secret it may pass on the
    # browser's address so that rate limits apply per client and not to the frontend as a whole.
    trusted-proxy:
      secret: ${TRUSTED_PROXY_SECRET:}
    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:true}
      default-policy:
        capacity: 40
        refill-tokens: 20
        refill-period: 1s
      auth-policy:
        capacity: 10
        refill-tokens: 10
        refill-period: 1m
      auth-paths:
        - /api/auth/login
        - /api/auth/register
        - /api/auth/refresh

springdoc:
  swagger-ui:
    urls:
      - name: auth-service
        url: /docs/auth-service/v3/api-docs
      - name: user-service
        url: /docs/user-service/v3/api-docs
      - name: product-service
        url: /docs/product-service/v3/api-docs
      - name: inventory-service
        url: /docs/inventory-service/v3/api-docs
      - name: cart-service
        url: /docs/cart-service/v3/api-docs
      - name: order-service
        url: /docs/order-service/v3/api-docs
      - name: payment-service
        url: /docs/payment-service/v3/api-docs
      - name: notification-service
        url: /docs/notification-service/v3/api-docs
