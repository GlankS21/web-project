server:
  port: ${PAYMENT_SERVICE_PORT:8087}

spring:
  datasource:
    url: jdbc:postgresql://${app.infra.postgres-host}:${app.infra.postgres-port}/payment_db
    username: payment_user
    password: ${PAYMENT_DB_PASSWORD}

app:
  payment:
    # yookassa: real (test) YooKassa shop; mock: local imitation of the payment page, no account needed
    provider: ${PAYMENT_PROVIDER:mock}
    # Online payments are accepted in this currency only
    currency: RUB
    # Public address of the website: the customer returns there after paying
    max-attempts: 5
    yookassa:
      api-url: https://api.yookassa.ru/v3
      shop-id: ${YOOKASSA_SHOP_ID:}
      secret-key: ${YOOKASSA_SECRET_KEY:}
      connect-timeout: 5s
      read-timeout: 20s
    # Asks the provider about operations it has not notified yet (no webhook when running locally)
    reconciliation:
      interval: 1m
      min-age: 1m
      max-age: 24h
      batch-size: 50
    outbox:
      poll-interval: 1s
      batch-size: 50
      retention: 7d
